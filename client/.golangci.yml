version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - staticcheck
    - revive
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Sscanf
        - os.Remove
        - os.RemoveAll
        - os.Chdir
        - (io.Closer).Close
        - (*os.File).Close
        - (*text/tabwriter.Writer).Flush
        - (*encoding/json.Encoder).Encode
    revive:
      rules:
        - name: exported
          disabled: true
