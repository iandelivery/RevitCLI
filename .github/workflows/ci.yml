name: CI

on:
  pull_request: {}
  push:
    branches: [main]
    paths: [bridge/**, client/**]

permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NUGET_XMLDOC_MODE: skip
  GO_VERSION: '1.26.11'

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      bridge: ${{ steps.filter.outputs.bridge }}
      client: ${{ steps.filter.outputs.client }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect changed areas
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            bridge:
              - 'bridge/**'
            client:
              - 'client/**'

  bridge:
    needs: changes
    if: needs.changes.outputs.bridge == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 6.0.x

      - name: Build bridge
        run: dotnet build bridge/RevitCliBridge.sln

      - name: Test bridge
        run: dotnet test bridge/RevitCliBridge.Tests/RevitCliBridge.Tests.csproj --no-build

  client:
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: client/go.sum

      - name: Check gofmt
        working-directory: client
        shell: pwsh
        run: |
          $files = gofmt -l .
          if ($files) { $files; exit 1 }

      - name: Vet, test, and build client
        working-directory: client
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        shell: pwsh
        run: |
          go vet ./...
          go test ./...
          go build -trimpath -o revit-cli.exe ./cmd/revit-cli

  lint:
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: client/go.sum

      - name: Lint client
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: client

  secrets:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
